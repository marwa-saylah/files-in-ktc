<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibTech Admin | Dashboard</title>
    <style>
        /* --- 1. CORE STYLING --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        :root {
            --bg: #0b0f19;
            --sidebar-bg: #111827;
            --primary: #00d2ff;
            --accent: #3b82f6;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 2. SIDEBAR STYLING --- */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
        }

        .sidebar .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 50px;
            text-align: center;
        }

        .sidebar nav ul {
            list-style: none;
        }

        .sidebar nav ul li {
            margin-bottom: 10px;
        }

        .sidebar nav ul li a {
            text-decoration: none;
            color: var(--text-muted);
            padding: 12px 15px;
            display: block;
            border-radius: 10px;
            font-weight: 500;
            transition: 0.3s;
        }

        .sidebar nav ul li a:hover {
            background: rgba(0, 210, 255, 0.1);
            color: var(--primary);
        }

        /* --- 3. MAIN CONTENT AREA --- */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        /* --- 4. PAGE SWITCHING LOGIC (CSS Target) --- */
        .page {
            display: none; /* Dhammaan bogagga qari marka hore */
            animation: fadeIn 0.5s ease;
        }

        /* Marka link-ga la riixo, muuji bogga saxda ah */
        #home:target, #registration:target, #form:target {
            display: block;
        }

        /* Haddii aan waxba la dooran (default), muuji home */
        #home { display: block; } 
        #home:target ~ #registration, #home:target ~ #form { display: none; }

        /* --- 5. COMPONENT STYLING (Cards, Forms) --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-card h3 { color: var(--text-muted); font-size: 14px; margin-bottom: 10px; }
        .stat-card .value { font-size: 28px; font-weight: 700; color: var(--primary); }

        /* Form Styling */
        .form-container {
            max-width: 600px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            margin-top: 20px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            outline: none;
        }

        .submit-btn {
            background: var(--primary);
            color: var(--bg);
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">LIBTECH PRO</div>
        <nav>
            <ul>
                <li><a href="#home">🏠 Dashboard Home</a></li>
                <li><a href="#registration">📝 Registration</a></li>
                <li><a href="#form">📖 Add New Book</a></li>
                <li><a href="index.html" style="color: #ff4d4d; margin-top: 50px;">🚪 Logout</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        
        <div class="top-bar">
            <h2>System Overview</h2>
            <div style="background: var(--card-bg); padding: 8px 15px; border-radius: 30px; font-size: 14px;">
                👤 Admin: Axmed Cali
            </div>
        </div>

        <section id="home" class="page">
            <div class="card-grid">
                <div class="stat-card">
                    <h3>TOTAL BOOKS</h3>
                    <div class="value">4,520</div>
                </div>
                <div class="stat-card">
                    <h3>ACTIVE USERS</h3>
                    <div class="value">1,105</div>
                </div>
                <div class="stat-card">
                    <h3>BOOKS BORROWED</h3>
                    <div class="value">342</div>
                </div>
            </div>
            <div style="margin-top: 40px;">
                <img src="https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=800" style="width: 100%; border-radius: 20px; height: 300px; object-fit: cover;">
            </div>
        </section>

        <section id="registration" class="page">
            <h2>User Registration</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Diiwaangeli ardayda ama macaamiisha cusub.</p>
            <div class="form-container">
                <form>
                    <div class="form-group">
                        <label>Magaca Buuxa</label>
                        <input type="text" placeholder="Geli magaca...">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="example@gmail.com">
                    </div>
                    <div class="form-group">
                        <label>Nooca Xubinnimada</label>
                        <select>
                            <option>Student</option>
                            <option>Teacher</option>
                            <option>Visitor</option>
                        </select>
                    </div>
                    <button type="button" class="submit-btn">Diiwaangeli Macmiilka</button>
                </form>
            </div>
        </section>

        <section id="form" class="page">
            <h2>Add New Book</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Ku dar buug cusub kaydka maktabadda.</p>
            <div class="form-container">
                <form>
                    <div class="form-group">
                        <label>Cinwaanka Buugga</label>
                        <input type="text" placeholder="Magaca buugga...">
                    </div>
                    <div class="form-group">
                        <label>Magaca Qoraaga</label>
                        <input type="text" placeholder="Qoraaga buugga...">
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" placeholder="Tusaale: History, Science...">
                    </div>
                    <button type="button" class="submit-btn">Keydi Buugga</button>
                </form>
            </div>
        </section>

    </main>

</body>
</html>
